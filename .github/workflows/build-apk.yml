name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            unzip -o "$ZIPFILE" -d extracted
            PROJECT_DIR=$(find extracted -iname "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: aplikasi-keuangan-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
